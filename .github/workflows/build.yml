name: Build shop pages
# Puts each shop's current items, prices and photos into the pages, so Google and Facebook can read them.
# Runs only when started by hand: Actions → Build shop pages → Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pages from the shops' live data
        run: node tools/build.mjs
      - name: Save changes
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update shop pages"
          git push
